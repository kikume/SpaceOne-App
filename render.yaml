# ============================================================
# Render Blueprint — CryptoVault (backend API + PostgreSQL)
# Como usar: render.com → New + → Blueprint → conecte este repositório.
# O Render lê este arquivo, cria o banco e o serviço, e pede os 3 segredos
# marcados como "sync: false" (você cola os valores que eu te passei).
# ============================================================
databases:
  - name: cryptovault-db
    databaseName: cryptovault
    user: cryptovault
    plan: free          # grátis p/ começar (limitações: ver DEPLOY.md). Paga: 'basic-256mb'.
    region: oregon

services:
  - type: web
    name: cryptovault-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: cd ../frontend && npm ci && npm run build && cp -r build ../backend/public && cd ../backend && npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pagamento Solana (endereço público que recebe + RPC)
      - key: SOLANA_PAY_ADDRESS
        value: EPsQUSysoDn9FGyUvCDvypn2hSkCPERzszYeUyHyqaAs
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: PRICE_USD
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: cryptovault-db
          property: connectionString
      # Os 3 segredos abaixo: o Render vai pedir pra você colar no deploy.
      # GUARDE-OS num lugar seguro — perder o TOTP_ENC_KEY tranca o 2FA de todos.
      - key: JWT_SECRET
        sync: false
      - key: TOTP_ENC_KEY
        sync: false
      - key: PARAMS_PEPPER
        sync: false
